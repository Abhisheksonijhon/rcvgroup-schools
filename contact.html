<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>संपर्क | श्री रमेशचंद्र आवासीय विद्यालय, हरपालपुर</title>
<meta name="description" content="श्री रमेशचंद्र आवासीय विद्यालय, हरपालपुर (छतरपुर, म.प्र.) – गुरुकुल परम्परा पर आधारित, MP Board मान्यता प्राप्त हिंदी माध्यम विद्यालय।">
<link rel="icon" href="assets/img/rcvlgo-1.png"><link rel="stylesheet" href="assets/css/style.css"></head><body>
<main>
<div class="wrap page-title"><h1>संपर्क करें</h1></div>
<div class="wrap"><p class="prose" style="margin-bottom:20px">प्रवेश, फीस या सुझाव के लिए यह फ़ॉर्म भरें। हम जल्द उत्तर देंगे।</p>
<form name="contact" method="POST" data-netlify="true"><input type="hidden" name="form-name" value="contact">
<label>विद्यार्थी / अभिभावक का नाम<input name="name" required></label>
<label>ईमेल<input type="email" name="email"></label>
<label>मोबाइल नंबर<input type="tel" name="phone"></label>
<label>विषय<select name="topic"><option>प्रवेश</option><option>फीस</option><option>पढ़ाई / शिक्षक</option><option>सुझाव / शिकायत</option><option>अन्य</option></select></label>
<label>आपका संदेश<textarea name="message" rows="5"></textarea></label>
<button class="btn" type="submit">संदेश भेजें</button></form></div>
</main>
<script src="assets/js/main.js"></script></body></html>
